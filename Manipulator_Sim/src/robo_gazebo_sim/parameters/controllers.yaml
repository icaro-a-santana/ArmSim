# [ARQUIVO NOVO] Configurações dos controladores do ros2_control para o braço e a garra

# Configuração global do gerenciador de controladores
controller_manager:
  ros__parameters:
    update_rate: 100 # Taxa de atualização em Hz
    use_sim_time: true # Utiliza o tempo do simulador (Gazebo)

    # Broadcaster que lê e publica o estado atual de todas as juntas
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controlador de trajetória para as juntas principais do braço
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controlador de trajetória para as juntas da garra (gripper)
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Configurações específicas do controlador do braço
arm_controller:
  ros__parameters:
    joints:
      - base_second_joint
      - second_third_joint
      - third_fourth_joint
      - fourth_hand_joint
    # Interfaces pelas quais o controlador envia comandos
    command_interfaces:
      - position
    # Interfaces pelas quais o controlador lê o estado atual
    state_interfaces:
      - position
      - velocity

# Configurações específicas do controlador da garra
gripper_controller:
  ros__parameters:
    joints:
      - hand_right_gripper_joint
      - hand_left_gripper_joint
    # Interfaces pelas quais o controlador envia comandos
    command_interfaces:
      - position
    # Interfaces pelas quais o controlador lê o estado atual
    state_interfaces:
      - position
      - velocity
