    robot_description_semantic: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!--\
      \ [ARQUIVO NOVO] Defini\xE7\xE3o Sem\xE2ntica do Rob\xF4 para o MoveIt -->\n\
      <robot name=\"PENSAR\">\n\n    <!-- DEFINI\xC7\xC3O DO GRUPOS -->\n    <!--\
      \ Grupo de planejamento para o bra\xE7o, usando cadeia cinem\xE1tica da base\
      \ at\xE9 a m\xE3o -->\n    <group name=\"arm\">\n        <chain base_link=\"\
      base_link\" tip_link=\"hand_link\"/>\n    </group>\n    <!-- Grupo de planejamento\
      \ da garra, agrupando os links e juntas dos 'dedos' -->\n    <group name=\"\
      gripper\">\n        <link name=\"right_gripper_link\"/>\n        <link name=\"\
      left_gripper_link\"/>\n        <joint name=\"hand_right_gripper_joint\"/>\n\
      \        <joint name=\"hand_left_gripper_joint\"/>\n    </group>\n\n    <!--\
      \ DEFINI\xC7\xC3O DAS POSES -->\n    <!-- Poses nomeadas: Posi\xE7\xE3o de repouso\
      \ (home) para o bra\xE7o -->\n    <group_state name=\"home\" group=\"arm\">\n\
      \        <joint name=\"base_second_joint\" value=\"0\"/>\n        <joint name=\"\
      second_third_joint\" value=\"0\"/>\n        <joint name=\"third_fourth_joint\"\
      \ value=\"0\"/>\n        <joint name=\"fourth_hand_joint\" value=\"0\"/>\n \
      \   </group_state>\n    \n    <!-- Poses nomeadas para a garra: Aberta -->\n\
      \    <group_state name=\"open\" group=\"gripper\">\n        <joint name=\"hand_right_gripper_joint\"\
      \ value=\"0\"/>\n        <joint name=\"hand_left_gripper_joint\" value=\"0\"\
      />\n    </group_state>\n    \n    <!-- Poses nomeadas para a garra: Fechada\
      \ -->\n    <group_state name=\"close\" group=\"gripper\">\n        <joint name=\"\
      hand_right_gripper_joint\" value=\"1.0\"/>\n        <joint name=\"hand_left_gripper_joint\"\
      \ value=\"-1.0\"/>\n    </group_state>\n\n    <!-- TRATAMENTO DAS COLI\xC7\xD5\
      ES -->\n    <!-- Matriz de colis\xE3o (ACM): Desabilita verifica\xE7\xE3o de\
      \ colis\xE3o entre links adjacentes e que nunca se tocam -->\n    <disable_collisions\
      \ link1=\"base_link\" link2=\"second_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
      \ link1=\"second_link\" link2=\"third_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
      \ link1=\"third_link\" link2=\"fourth_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
      \ link1=\"fourth_link\" link2=\"hand_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
      \ link1=\"hand_link\" link2=\"right_gripper_link\" reason=\"Adjacent\"/>\n \
      \   <disable_collisions link1=\"hand_link\" link2=\"left_gripper_link\" reason=\"\
      Adjacent\"/>\n    <disable_collisions link1=\"right_gripper_link\" link2=\"\
      left_gripper_link\" reason=\"Never\"/>\n</robot>\n"
